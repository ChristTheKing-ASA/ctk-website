name: PR preview

# Every pull request gets its own preview deployment on workers.dev so
# reviewers can test the built site before anything reaches production.
# Production remains GitHub Pages, deployed only on push to main.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Preview serves from the domain root on workers.dev, the same shape
      # as the eventual custom-domain build, so no basePath here.
      - run: npm run build
      - run: npm run test:cloudflare
      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" | tee upload.log
          url=$(grep -oE 'https://pr-[^[:space:]]*\.workers\.dev' upload.log | head -1)
          if [ -z "$url" ]; then
            url=$(grep -oE 'https://[^[:space:]]*\.workers\.dev' upload.log | head -1)
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.upload.outputs.url }}
        run: |
          if [ -n "$URL" ]; then
            body="Preview: $URL (updates on every push; commit ${{ github.event.pull_request.head.sha }})"
          else
            body="Preview uploaded, but no URL was captured; check the workflow log."
          fi
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "$body" --edit-last --create-if-none
