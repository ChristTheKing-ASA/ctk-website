# Staging site on GitHub Pages.
#
# Production is Cloudflare, serving ctkasa.com from the domain root. This
# workflow publishes a reviewable copy to
# https://christtheking-asa.github.io/ctk-website/ so changes can be shown to
# the parish before they reach the real site.
#
# It builds from the `staging` branch, not main, which is what keeps the two
# apart: merge to staging to show something, merge to main to ship it.
name: Deploy staging to GitHub Pages

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:run
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          # GitHub Pages serves this repo from a subpath. Production is a root
          # domain on Cloudflare and builds without these.
          NEXT_BASE_PATH: /ctk-website
          NEXT_PUBLIC_BASE_PATH: /ctk-website
          # Keystatic assumes /keystatic is domain-rooted. The dependency patch
          # reads this value for its UI and OAuth routes.
          NEXT_PUBLIC_KEYSTATIC_PATH: /ctk-website/keystatic
          # Staging is publicly reachable and duplicates ctkasa.com word for
          # word. Without this it competes with the real site in search.
          NEXT_PUBLIC_NOINDEX: "1"
      - run: npm run test:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
